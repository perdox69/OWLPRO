<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR HER | OUR SPECIAL STORY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Mali:wght@200;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --dark: #0a0a0a; 
            --transition-speed: 1.8s;
            --slide-duration: 10000ms; /* หน้าละ 10 วินาที เพื่อให้พอดีกับความยาวเพลง */
        }

        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Playfair Display', serif; overflow: hidden; height: 100%; cursor: none; }

        /* Custom Cursor */
        #cursor { position: fixed; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 10000; mix-blend-mode: difference; }
        #cursor-follower { position: fixed; width: 35px; height: 35px; border: 1px solid var(--gold); border-radius: 50%; pointer-events: none; z-index: 10000; transition: all 0.2s ease-out; opacity: 0.5; }

        /* Progress Bar */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.05); z-index: 10001; }
        #progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width linear; }

        /* Curtain */
        #curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity var(--transition-speed) ease-in-out; }
        body.transitioning #curtain { opacity: 1; pointer-events: auto; }

        /* Stage */
        #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity 1.5s ease; padding: 30px; box-sizing: border-box; }
        .slide.active { opacity: 1; }

        .visual-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; object-fit: cover; opacity: 0.35; filter: brightness(0.6); transform: scale(1.15); transition: transform 10s linear; }
        .active .visual-bg { transform: scale(1); }

        .content-overlay { z-index: 20; max-width: 850px; }
        .pre-title { font-family: 'Cinzel'; font-size: 0.75rem; letter-spacing: 12px; color: var(--gold); margin-bottom: 25px; text-transform: uppercase; }
        h1 { font-size: clamp(1.8rem, 6vw, 3.5rem); font-weight: 400; margin: 0; letter-spacing: 12px; text-transform: uppercase; line-height: 1.4; }
        h2 { font-family: 'Mali'; font-weight: 200; font-size: clamp(0.9rem, 2.5vw, 1.2rem); line-height: 2.2; margin-top: 30px; color: rgba(255,255,255,0.85); }

        .photo-frame { width: 85%; max-width: 400px; margin: 0 auto 30px auto; box-shadow: 0 40px 80px rgba(0,0,0,0.9); border: 1px solid rgba(197, 160, 89, 0.2); padding: 12px; background: rgba(255,255,255,0.02); }
        .photo-img { width: 100%; display: block; }

        #entrance { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--dark); position: fixed; width: 100%; z-index: 5000; transition: opacity 2s; }
        .luxury-input { background: transparent; border: none; border-bottom: 1px solid rgba(197, 160, 89, 0.3); color: #fff; padding: 15px; font-size: 1.2rem; text-align: center; outline: none; width: 320px; font-family: 'Mali'; letter-spacing: 2px; transition: 0.5s; }
        .luxury-input:focus { border-bottom: 1px solid var(--gold); }

        .heart { position: absolute; color: #ff4d4d; pointer-events: none; z-index: 100; animation: floatUp 5s linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(110vh) scale(0); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        /* ซ่อนเครื่องเล่น YouTube */
        #youtube-player { position: absolute; top: -1000px; left: -1000px; visibility: hidden; }
        
        #music-status { color: var(--gold); font-family: 'Mali'; font-size: 0.7rem; margin-top: 15px; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="cursor-follower"></div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <div id="youtube-player"></div>

    <div id="curtain"></div>

    <div id="entrance">
        <div style="font-family:'Cinzel'; letter-spacing:10px; color:var(--gold); margin-bottom:40px; font-size:0.9rem;">PRIVATE PREMIERE</div>
        <input type="text" id="pass" class="luxury-input" placeholder="พิมพ์คำบอกรักเพื่อเข้าสู่เรื่องราว" autocomplete="off">
        <div id="music-status">กำลังเตรียมเพลง...</div>
    </div>

    <div id="stage"><div id="slide-container"></div></div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // =============================================
        // ⬇️ ข้อมูล 20 สไลด์ (แก้ลิงก์รูปและข้อความตรงนี้) ⬇️
        // =============================================
        const allSlides = [
            { type: 'text', pre: 'CHAPTER I', h1: 'สำหรับอ้วนๆ', h2: '"หนังเรื่องที่ยาวที่สุด คือเรื่องราวที่เราเดินไปพร้อมกัน"' },
            { type: 'text_bg', bg: 'https://images.unsplash.com/photo-1516048015710-7a3b4c86be43?auto=format&fit=crop&w=2000', pre: 'OUR TIME', h1: '04.10.2024', h2: '"วันที่เค้ากลายเป็นคนยิ้มง่ายขึ้นเพราะมีอ้วน"' },
            { type: 'photo', img: 'URL_รูปที่_1', text: 'จำวันแรกที่เราคุยกันได้ไหม?' },
            { type: 'photo', img: 'URL_รูปที่_2', text: 'รอยยิ้มของอ้วนทำใจเค้าบางไปหมดเลย' },
            { type: 'photo', img: 'URL_รูปที่_3', text: 'รูปนี้อ้วนน่ารักมาก เห็นแล้วเค้ายิ้มตามทุกที' },
            { type: 'photo', img: 'URL_รูปที่_4', text: 'อาหารมื้อนั้นอร่อยขึ้นมากเพราะมีอ้วนอยู่ข้างๆ' },
            { type: 'photo', img: 'URL_รูปที่_5', text: 'ขอบคุณที่คอยเป็นกำลังใจให้กันเสมอมานะ' },
            { type: 'photo', img: 'URL_รูปที่_6', text: 'เค้าชอบเวลาที่เราได้หัวเราะด้วยกันแบบนี้ที่สุด' },
            { type: 'photo', img: 'URL_รูปที่_7', text: 'ทุกที่ที่เราไป กลายเป็นความทรงจำที่ดีเพราะมีเธอ' },
            { type: 'photo', img: 'URL_รูปที่_8', text: 'ขอบคุณที่อดทนกับความงี่เง่าของเค้าในบางวันนะ' },
            { type: 'photo', img: 'URL_รูปที่_9', text: 'อ้วนคือโลกทั้งใบที่มีแต่ความสดใสของเค้า' },
            { type: 'photo', img: 'URL_รูปที่_10', text: 'เราผ่านอะไรมาด้วยกันเยอะเหมือนกันเนอะ' },
            { type: 'photo', img: 'URL_รูปที่_11', text: 'เค้าสัญญาว่าจะดูแลอ้วนให้ดีที่สุดเท่าที่เค้าจะทำได้' },
            { type: 'photo', img: 'URL_รูปที่_12', text: 'อยู่เป็นความสุขของกันและกันแบบนี้ไปนานๆ นะ' },
            { type: 'photo', img: 'URL_รูปที่_13', text: 'ขอโทษที่บางครั้งอาจจะไม่ได้พูดว่ารักบ่อยๆ' },
            { type: 'photo', img: 'URL_รูปที่_14', text: 'แต่ในใจเค้ามีแต่อ้วนคนเดียวเสมอมาเลย' },
            { type: 'photo', img: 'URL_รูปที่_15', text: 'ขอบคุณที่เกิดมาให้เค้าได้รักนะคนดี' },
            { type: 'photo', img: 'URL_รูปที่_16', text: 'รอยยิ้มของอ้วนคือเหตุผลที่ทำให้เค้ามีความสุขในทุกวัน' },
            { type: 'photo', img: 'URL_รูปที่_17', text: 'หนังเรื่องนี้ยังไม่จบ และเค้าอยากแต่งมันต่อกับอ้วนนะ' },
            { type: 'text', pre: 'FINALE', h1: 'HAPPY VALENTINE', h2: 'รักอ้วนที่สุดในโลกเลย!<br><br> <span style="color:var(--gold); letter-spacing: 5px;">I AM YOURS FOREVER</span>' }
        ];

        let player;
        let isPlayerReady = false;
        let currentSlideIndex = 0;
        let isAnimating = false;
        let progressInterval;
        const SLIDE_DURATION = 10000;

        // YouTube API Initializer
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0', width: '0',
                videoId: 'yW63vW5vE9k', // เพลง ยิ้มง่าย - Fellow Fellow
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'yW63vW5vE9k' },
                events: {
                    'onReady': (event) => {
                        isPlayerReady = true;
                        document.getElementById('music-status').innerText = "เพลงพร้อมแล้วครับ :)";
                    }
                }
            });
        }

        const input = document.getElementById('pass');
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                const val = input.value.trim().toLowerCase();
                if (val.includes('รัก') || val.includes('love') || val.includes('ที่สุด')) {
                    startExperience();
                } else {
                    input.style.borderBottom = "1px solid red";
                    setTimeout(() => input.style.borderBottom = "1px solid rgba(197, 160, 89, 0.3)", 1000);
                }
            }
        });

        function startExperience() {
            // บังคับเล่นเพลงและเปิดเสียง
            if (player && isPlayerReady) {
                player.unMute();
                player.setVolume(100);
                player.playVideo();
            }

            document.getElementById('entrance').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entrance').style.display = 'none';
                document.getElementById('stage').style.display = 'block';
                initSlides();
                startProgressBar();
            }, 2000);
        }

        function initSlides() {
            const container = document.getElementById('slide-container');
            allSlides.forEach((data, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                let inner = '';
                if (data.type === 'text') inner = `<div class="content-overlay"><p class="pre-title">${data.pre}</p><h1>${data.h1}</h1><h2>${data.h2}</h2></div>`;
                else if (data.type === 'text_bg') inner = `<img src="${data.bg}" class="visual-bg"><div class="content-overlay"><p class="pre-title">${data.pre}</p><h1>${data.h1}</h1><h2>${data.h2}</h2></div>`;
                else if (data.type === 'photo') inner = `<div class="content-overlay"><div class="photo-frame"><img src="${data.img}" class="photo-img"></div><div class="photo-caption">${data.text}</div></div>`;
                slide.innerHTML = inner;
                container.appendChild(slide);
            });
        }

        function startProgressBar() {
            const bar = document.getElementById('progress-bar');
            let width = 0;
            clearInterval(progressInterval);
            bar.style.width = '0%';
            const step = 100 / (SLIDE_DURATION / 50);
            progressInterval = setInterval(() => {
                width += step;
                bar.style.width = width + '%';
                if (width >= 100) {
                    clearInterval(progressInterval);
                    if (currentSlideIndex < allSlides.length - 1) nextSlide();
                    else startHearts();
                }
            }, 50);
        }

        function nextSlide() {
            if (isAnimating) return;
            isAnimating = true;
            document.body.classList.add('transitioning');
            setTimeout(() => {
                const slides = document.querySelectorAll('.slide');
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex++;
                slides[currentSlideIndex].classList.add('active');
                setTimeout(() => {
                    document.body.classList.remove('transitioning');
                    isAnimating = false;
                    startProgressBar();
                }, 300);
            }, 1800);
        }

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 400);
        }

        // Cursor logic
        const cursor = document.getElementById('cursor');
        const follower = document.getElementById('cursor-follower');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            setTimeout(() => {
                follower.style.left = e.clientX - 15 + 'px';
                follower.style.top = e.clientY - 15 + 'px';
            }, 60);
        });
    </script>
</body>
</html>
