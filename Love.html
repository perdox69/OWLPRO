<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR HER | BETTER TOGETHER</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Mali:wght@200;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --dark: #0a0a0a; 
            --transition-speed: 2.0s;
            --slide-duration: 7000ms; /* หน้าละ 7 วินาที */
        }

        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Playfair Display', serif; overflow: hidden; height: 100%; cursor: none; }

        /* Custom Cursor */
        #cursor { position: fixed; width: 8px; height: 8px; background: var(--gold); border-radius: 50%; pointer-events: none; z-index: 10000; mix-blend-mode: difference; }
        #cursor-follower { position: fixed; width: 35px; height: 35px; border: 1px solid var(--gold); border-radius: 50%; pointer-events: none; z-index: 10000; transition: all 0.2s ease-out; opacity: 0.5; }

        /* UI Elements */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.05); z-index: 10001; }
        #progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width linear; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 20%, black 150%); pointer-events: none; z-index: 90; }

        /* Curtain (ม่านดำสลับฉาก) */
        #curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity var(--transition-speed) ease-in-out; }
        body.transitioning #curtain { opacity: 1; pointer-events: auto; }

        /* Stage & Slides */
        #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity 1.5s ease; padding: 30px; box-sizing: border-box; }
        .slide.active { opacity: 1; }

        /* Ken Burns Effect */
        .visual-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; object-fit: cover; opacity: 0.35; filter: brightness(0.5); transform: scale(1.1); transition: transform 7s linear; }
        .active .visual-bg { transform: scale(1); }

        .content-overlay { z-index: 20; max-width: 850px; }
        .pre-title { font-family: 'Cinzel'; font-size: 0.7rem; letter-spacing: 12px; color: var(--gold); margin-bottom: 25px; }
        h1 { font-size: clamp(1.6rem, 5vw, 3.2rem); font-weight: 400; margin: 0; letter-spacing: 12px; text-transform: uppercase; line-height: 1.4; }
        h2 { font-family: 'Mali'; font-weight: 200; font-size: clamp(0.9rem, 2.5vw, 1.1rem); line-height: 2.2; margin-top: 25px; color: rgba(255,255,255,0.85); }

        .photo-frame { width: 85%; max-width: 380px; margin: 0 auto 25px auto; box-shadow: 0 40px 80px rgba(0,0,0,1); border: 1px solid rgba(197, 160, 89, 0.2); padding: 10px; background: rgba(255,255,255,0.02); }
        .photo-img { width: 100%; display: block; border-radius: 2px; }

        /* Entrance */
        #entrance { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--dark); position: fixed; width: 100%; z-index: 5000; transition: opacity 2s; }
        .luxury-input { background: transparent; border: none; border-bottom: 1px solid rgba(197, 160, 89, 0.3); color: #fff; padding: 15px; font-size: 1.2rem; text-align: center; outline: none; width: 320px; font-family: 'Mali'; letter-spacing: 2px; transition: 0.5s; }
        .luxury-input:focus { border-bottom: 1px solid var(--gold); }

        /* Heart Effect */
        .heart { position: absolute; color: #ff4d4d; pointer-events: none; z-index: 100; animation: floatUp 5s linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(110vh) scale(0); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="cursor"></div>
    <div id="cursor-follower"></div>
    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <audio id="bg-music" loop>
        <source src="https://cdn.discordapp.com/attachments/1472206964619739189/1472207020806508665/Better_Together_-_fellow_fellow_OFFICIAL_MV___OST_9_Years_of_you_.mp3?ex=6991bb22&is=699069a2&hm=614bcc1569eb1c885a728d35152902869a03cb5672af73f5cc4385ed549e5c5f&" type="audio/mpeg">
    </audio>

    <div class="vignette"></div>
    <div id="curtain"></div>

    <div id="entrance">
        <div style="font-family:'Cinzel'; letter-spacing:10px; color:var(--gold); margin-bottom:40px; font-size:0.8rem;">THE PRIVATE PREMIERE</div>
        <input type="text" id="pass" class="luxury-input" placeholder="คำบอกรักของเราคือ?" autocomplete="off">
    </div>

    <div id="stage"><div id="slide-container"></div></div>

    <script>
        // ทั้งหมด 20 หน้า เพื่อให้พอดีกับเพลง 3:03 นาที
        const allSlides = [
            { type: 'text', pre: 'INTRODUCTION', h1: 'สำหรับอ้วนๆ', h2: '"หนังเรื่องที่สวยงามที่สุด คือเรื่องราวที่เราเดินไปพร้อมกัน"' },
            { type: 'text_bg', bg: 'https://images.unsplash.com/photo-1516048015710-7a3b4c86be43?auto=format&fit=crop&w=2000', pre: 'OUR JOURNEY', h1: '04 . 10 . 24', h2: '"วันแรกที่เค้ากลายเป็นคนยิ้มง่ายขึ้นเพราะมีเธอ"' },
            { type: 'photo', img: 'URL_รูปที่_1', text: 'จำวันแรกที่เราคุยกันได้ไหม?' },
            { type: 'photo', img: 'URL_รูปที่_2', text: 'ขอบคุณที่เข้ามาทำให้ทุกวันเป็นวันที่พิเศษนะ' },
            { type: 'photo', img: 'URL_รูปที่_3', text: 'รอยยิ้มของอ้วนคือสิ่งที่เค้าอยากเห็นมากที่สุดในโลก' },
            { type: 'photo', img: 'URL_รูปที่_4', text: 'อาหารมื้อนั้นอร่อยขึ้นมากเพราะมีอ้วนอยู่ข้างๆ' },
            { type: 'photo', img: 'URL_รูปที่_5', text: 'ขอบคุณที่คอยซัพพอร์ตกันในทุกๆ เรื่องเลยนะ' },
            { type: 'photo', img: 'URL_รูปที่_6', text: 'เค้าชอบเวลาที่เราได้หัวเราะด้วยกันแบบนี้ที่สุด' },
            { type: 'photo', img: 'URL_รูปที่_7', text: 'ไม่ว่าที่ไหน แค่มีอ้วนไปด้วยก็พอแล้วสำหรับเค้า' },
            { type: 'photo', img: 'URL_รูปที่_8', text: 'ขอบคุณที่อดทนกับคนงี่เง่าแบบเค้านะครับ' },
            { type: 'photo', img: 'URL_รูปที่_9', text: 'เราผ่านอะไรมาด้วยกันเยอะเหมือนกันเนอะ' },
            { type: 'photo', img: 'URL_รูปที่_10', text: 'อยากให้เรารักษากันและกันไว้แบบนี้ไปนานๆ' },
            { type: 'photo', img: 'URL_รูปที่_11', text: 'อ้วนคือของขวัญที่โชคดีที่สุดในชีวิตเค้า' },
            { type: 'photo', img: 'URL_รูปที่_12', text: 'ขอโทษที่บางครั้งอาจจะไม่ได้พูดว่ารักบ่อยๆ' },
            { type: 'photo', img: 'URL_รูปที่_13', text: 'แต่ในใจเค้ามีแต่อ้วนคนเดียวเสมอมานะ' },
            { type: 'photo', img: 'URL_รูปที่_14', text: 'ขอบคุณที่เกิดมาให้เค้าได้รักนะคนดี' },
            { type: 'photo', img: 'URL_รูปที่_15', text: 'สัญญาว่าจะเดินเคียงข้างกันไปแบบนี้เรื่อยๆ' },
            { type: 'photo', img: 'URL_รูปที่_16', text: 'อยู่เป็นความสุขของกันและกันแบบนี้ตลอดไปเลยนะ' },
            { type: 'photo', img: 'URL_รูปที่_17', text: 'รักอ้วนนะ... รักที่สุดในโลก' },
            { type: 'text', pre: 'FINALE', h1: 'HAPPY VALENTINE', h2: 'ขอบคุณที่ทำให้ชีวิตของเค้าดีขึ้นเมื่อมีเธอ<br><br> <span style="color:var(--gold); letter-spacing: 5px;">BETTER TOGETHER FOREVER</span>' }
        ];

        const music = document.getElementById('bg-music');
        const input = document.getElementById('pass');
        let currentSlideIndex = 0;
        let isAnimating = false;
        let progressInterval;
        const SLIDE_DURATION = 7000;

        // Custom Cursor
        document.addEventListener('mousemove', (e) => {
            document.getElementById('cursor').style.left = e.clientX + 'px';
            document.getElementById('cursor').style.top = e.clientY + 'px';
            setTimeout(() => {
                document.getElementById('cursor-follower').style.left = e.clientX-15+'px';
                document.getElementById('cursor-follower').style.top = e.clientY-15+'px';
            }, 60);
        });

        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                music.play();
                document.getElementById('entrance').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('entrance').style.display = 'none';
                    document.getElementById('stage').style.display = 'block';
                    initSlides();
                    startProgress();
                }, 2000);
            }
        });

        function initSlides() {
            const container = document.getElementById('slide-container');
            allSlides.forEach((data, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                let inner = '';
                if (data.type === 'text') inner = `<div class="content-overlay"><p class="pre-title">${data.pre}</p><h1>${data.h1}</h1><h2>${data.h2}</h2></div>`;
                else if (data.type === 'text_bg') inner = `<img src="${data.bg}" class="visual-bg"><div class="content-overlay"><p class="pre-title">${data.pre}</p><h1>${data.h1}</h1><h2>${data.h2}</h2></div>`;
                else if (data.type === 'photo') inner = `<div class="content-overlay"><div class="photo-frame"><img src="${data.img}" class="photo-img"></div><div class="photo-caption">${data.text}</div></div>`;
                slide.innerHTML = inner;
                container.appendChild(slide);
            });
        }

        function startProgress() {
            const bar = document.getElementById('progress-bar');
            let width = 0;
            clearInterval(progressInterval);
            bar.style.width = '0%';
            const step = 100 / (SLIDE_DURATION / 50);
            progressInterval = setInterval(() => {
                width += step;
                bar.style.width = width + '%';
                if (width >= 100) {
                    clearInterval(progressInterval);
                    if (currentSlideIndex < allSlides.length - 1) goToSlide(currentSlideIndex + 1);
                    else startHearts();
                }
            }, 50);
        }

        function goToSlide(index) {
            if (isAnimating) return;
            isAnimating = true;
            document.body.classList.add('transitioning');
            setTimeout(() => {
                const slides = document.querySelectorAll('.slide');
                slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = index;
                slides[currentSlideIndex].classList.add('active');
                setTimeout(() => {
                    document.body.classList.remove('transitioning');
                    isAnimating = false;
                    startProgress();
                }, 300);
            }, 2000);
        }

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 400);
        }
    </script>
</body>
</html>
