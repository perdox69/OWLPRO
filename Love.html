<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOR HER | BETTER TOGETHER</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Mali:wght@200;400&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #c5a059; 
            --dark: #0a0a0a; 
            --transition-speed: 2.0s;
            --slide-duration: 7000ms; /* หน้าละ 7 วินาที */
        }

        body, html { margin: 0; padding: 0; background: var(--dark); color: #fff; font-family: 'Playfair Display', serif; overflow: hidden; height: 100%; cursor: none; }

        /* --- New Heart & Sparkle Cursor --- */
        #cursor-heart { 
            position: fixed; 
            font-size: 24px; 
            pointer-events: none; 
            z-index: 10000; 
            transform: translate(-50%, -50%);
            user-select: none;
            filter: drop-shadow(0 0 5px rgba(255,105,180,0.8));
        }
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #ff85a1;
            animation: sparkle-fade 1s linear forwards;
        }
        @keyframes sparkle-fade {
            0% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) translateY(30px) rotate(180deg); opacity: 0; }
        }

        /* UI Elements */
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 3px; background: rgba(255,255,255,0.05); z-index: 10001; }
        #progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width linear; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 20%, black 150%); pointer-events: none; z-index: 90; }

        /* Curtain (ม่านดำสลับฉาก) */
        #curtain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 9999; opacity: 0; pointer-events: none; transition: opacity var(--transition-speed) ease-in-out; }
        body.transitioning #curtain { opacity: 1; pointer-events: auto; }

        /* Stage & Slides */
        #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 10; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; opacity: 0; transition: opacity 1.5s ease; padding: 30px; box-sizing: border-box; }
        .slide.active { opacity: 1; }

        /* Ken Burns Effect */
        .visual-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; object-fit: cover; opacity: 0.35; filter: brightness(0.5); transform: scale(1.1); transition: transform 7s linear; }
        .active .visual-bg { transform: scale(1); }

        .content-overlay { z-index: 20; max-width: 850px; }
        .pre-title { font-family: 'Cinzel'; font-size: 0.7rem; letter-spacing: 12px; color: var(--gold); margin-bottom: 25px; }
        h1 { font-size: clamp(1.6rem, 5vw, 3.2rem); font-weight: 400; margin: 0; letter-spacing: 12px; text-transform: uppercase; line-height: 1.4; }
        h2 { font-family: 'Mali'; font-weight: 200; font-size: clamp(0.9rem, 2.5vw, 1.1rem); line-height: 2.2; margin-top: 25px; color: rgba(255,255,255,0.85); }

        .photo-frame { width: 85%; max-width: 380px; margin: 0 auto 25px auto; box-shadow: 0 40px 80px rgba(0,0,0,1); border: 1px solid rgba(197, 160, 89, 0.2); padding: 10px; background: rgba(255,255,255,0.02); }
        .photo-img { width: 100%; display: block; border-radius: 2px; }

        /* Entrance */
        #entrance { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--dark); position: fixed; width: 100%; z-index: 5000; transition: opacity 2s; }
        .luxury-input { background: transparent; border: none; border-bottom: 1px solid rgba(197, 160, 89, 0.3); color: #fff; padding: 15px; font-size: 1.2rem; text-align: center; outline: none; width: 320px; font-family: 'Mali'; letter-spacing: 2px; transition: 0.5s; cursor: none; }
        .luxury-input:focus { border-bottom: 1px solid var(--gold); }

        /* Heart Effect */
        .heart { position: absolute; color: #ff4d4d; pointer-events: none; z-index: 100; animation: floatUp 5s linear forwards; }
        @keyframes floatUp { 0% { transform: translateY(110vh) scale(0); opacity: 1; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="cursor-heart">❤️</div>
    
    <div id="progress-container"><div id="progress-bar"></div></div>
    
    <audio id="bg-music" loop>
        <source src="https://cdn.discordapp.com/attachments/1472206964619739189/1472207020806508665/Better_Together_-_fellow_fellow_OFFICIAL_MV___OST_9_Years_of_you_.mp3?ex=6991bb22&is=699069a2&hm=614bcc1569eb1c885a728d35152902869a03cb5672af73f5cc4385ed549e5c5f&" type="audio/mpeg">
    </audio>

    <div class="vignette"></div>
    <div id="curtain"></div>

    <div id="entrance">
        <div id="entrance-title" style="font-family:'Cinzel'; letter-spacing:2px; color:var(--gold); margin-bottom:40px; font-size:2rem; text-align: center; transition: all 0.5s;">For U | Princess Yenee</div>
        <input type="text" id="pass" class="luxury-input" placeholder="Do U love Me? (yes/no)" autocomplete="off">
    </div>

    <div id="stage"><div id="slide-container"></div></div>

    <script>
        const allSlides = [
            { type: 'text', pre: 'INTRODUCTION', h1: 'สำหรับอ้วนๆ', h2: '"หนังเรื่องที่สวยงามที่สุด คือเรื่องราวที่เราเดินไปพร้อมกัน"' },
            { type: 'text_bg', bg: 'https://media.discordapp.net/attachments/1472206964619739189/1472225164824543354/IMG_7789.jpg?ex=6991cc07&is=69907a87&hm=108d3dc2a6c07a9f77074b8cbe517f00d9cdea5ddfb1b361efa8657122a21b48&=&format=webp&width=645&height=860', pre: 'OUR JOURNEY', h1: '04 . 10 . 24', h2: '"วันแรกที่เค้ากลายเป็นคนยิ้มง่ายขึ้นเพราะมีอ้วน"' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472213665032831100/IMG_7537.jpg?ex=6991c152&is=69906fd2&hm=5513f55987e8f495e4d1187663052199e8d8c0f038187965422878522ce03b43&=&format=webp&width=645&height=860', text: 'จำวันแรกที่เราคุยกันได้ไหม?' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472213940057407618/IMG_5852.jpg?ex=6991c193&is=69907013&hm=825101929c7d88ae9b358379ee059ffab40f36d265317cd968d70c5baa8f8086&=&format=webp&width=645&height=860', text: 'ขอบคุณที่เข้ามาทำให้ทุกวันเป็นวันที่พิเศษนะ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472214081359446166/IMG_7593.jpg?ex=6991c1b5&is=69907035&hm=133e433a501590f64ffca24971f2c52c5f5ae1bfec4ca9eaf2129c0e70cf31a1&=&format=webp&width=645&height=860', text: 'รอยยิ้มของอ้วนคือสิ่งที่เค้าอยากเห็นมากที่สุดในโลก' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472214230752301067/IMG_0650.jpg?ex=6991c1d9&is=69907059&hm=0b9466d491af7ac1dfda7cf64fe71544b37a8d210eed57bfadbe4b77929a2a6d&=&format=webp&width=943&height=708', text: 'อาหารมื้อนั้นอร่อยขึ้นมากเพราะมีอ้วนอยู่ข้างๆ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472214481420419236/IMG_1411.jpg?ex=6991c214&is=69907094&hm=f7923eeed68c2482bbfc4d9d7d0e2723ea045f3bf98f3ec98e2c848029932281&=&format=webp&width=943&height=530', text: 'ขอบคุณที่คอยซัพพอร์ตกันในทุกๆ เรื่องเลยนะ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472214595979444294/IMG_9628.jpg?ex=6991c230&is=699070b0&hm=c4212a03c1eec839d856009904018612a5da642429ed1dd020aa2b9691db23aa&=&format=webp&width=645&height=860', text: 'เค้าชอบเวลาที่เราได้หัวเราะด้วยกันแบบนี้ที่สุด' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472214701776568331/85B6AA6C-AC3F-42A8-84D2-C34EF20B7E03.jpg?ex=6991c249&is=699070c9&hm=1c1e00973fe225d9f2c5eae58c761fc2f521c260c0be3f1ae23330f6117153cb&=&format=webp&width=738&height=553', text: 'ไม่ว่าที่ไหน แค่มีอ้วนไปด้วยก็พอแล้วสำหรับเค้า' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472214826410574035/IMG_0109.jpg?ex=6991c267&is=699070e7&hm=40798fe3feea59d696d74d6ac838966094a9b4d8f26baee221c135d674942b3a&=&format=webp&width=645&height=860', text: 'ขอบคุณที่อดทนกับคนงี่เง่าแบบเค้านะครับ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215212252991558/IMG_0598.jpg?ex=6991c2c3&is=69907143&hm=de785b55a395a530e552d68ca5af4c438a12be9e71bc8488cc4c9d6842bf3933&=&format=webp&width=645&height=860', text: 'เราผ่านอะไรมาด้วยกันเยอะเหมือนกันเนอะ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215295983620298/IMG_1250.jpg?ex=6991c2d7&is=69907157&hm=a1086506746eacee2c2f0e55e1196b1162898a494024bdbf2668b223201cc879&=&format=webp&width=645&height=860', text: 'อยากให้เรารักษากันและกันไว้แบบนี้ไปนานๆ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215379563646976/IMG_0379.jpg?ex=6991c2ea&is=6990716a&hm=4c16087e9f97da7bc2c584fe40051e81e7fcdc89b03d3dd35d8cd316b9df6cd6&=&format=webp&width=645&height=860', text: 'อ้วนคือของขวัญที่โชคดีที่สุดในชีวิตเค้า' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215522819965152/IMG_1069.jpg?ex=6991c30d&is=6990718d&hm=522072e05bb88156a9a1ddbd61af409a44362ebf638f37b86b6ec6fb3afedf5b&=&format=webp&width=645&height=860', text: 'ขอโทษที่บางครั้งอาจจะไม่ได้พูดว่ารักบ่อยๆ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472223654715592755/IMG_9840.jpg?ex=6991ca9f&is=6990791f&hm=c34dfd3d459b2cf7db013dcfa4eb976e1c7f900164c21825f46fab6377ed5a36&=&format=webp&width=645&height=860', text: 'แต่ในใจเค้ามีแต่อ้วนคนเดียวเสมอมานะ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215677229076490/IMG_1103.jpg?ex=6991c331&is=699071b1&hm=73258ff6ea243b0e83a30a9c5a4e9dfcddf5e9a4d9e144bedc8348a3478d48eb&=&format=webp&width=645&height=860', text: 'ขอบคุณที่เกิดมาให้เค้าได้รักนะไออ้วนน' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215767817912370/IMG_5862.jpg?ex=6991c347&is=699071c7&hm=515fff718bb1784316360b16d2b5279efabfcb333992de50bb65ca0dbebaf56e&=&format=webp&width=645&height=860', text: 'สัญญาว่าจะเดินเคียงข้างกันไปแบบนี้เรื่อยๆ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472215847199309866/IMG_0807.jpg?ex=6991c35a&is=699071da&hm=2714041485be1079a84c3af6be3d2719d51b55d78b25373bd26ba09037a06499&=&format=webp&width=645&height=860', text: 'อยู่เป็นความสุขของกันและกันแบบนี้ตลอดไปเลยนะ' },
            { type: 'photo', img: 'https://media.discordapp.net/attachments/1472206964619739189/1472216179811549288/IMG_9788.jpg?ex=6991c3a9&is=69907229&hm=494e427d870cf097b81d04380904ba066ecdcdb12eb11a4c9b93bc4db82a1a0f&=&format=webp&width=645&height=860', text: 'รักอ้วนนะ... รักที่สุดในโลก' },
            { type: 'text', pre: 'FINALE', h1: 'HAPPY VALENTINE', h2: 'ขอบคุณที่ทำให้ชีวิตของเค้าดีขึ้นเมื่อมีอ้วนนน<br><br> <span style="color:var(--gold); letter-spacing: 5px;">BETTER TOGETHER FOREVER</span>' }
        ];

        const music = document.getElementById('bg-music');
        const input = document.getElementById('pass');
        const entranceTitle = document.getElementById('entrance-title');
        let currentSlideIndex = 0;
        let isAnimating = false;
        let progressInterval;
        const SLIDE_DURATION = 7000;

        /* --- Heart & Sparkle Cursor Logic --- */
        const heartCursor = document.getElementById('cursor-heart');
        document.addEventListener('mousemove', (e) => {
            heartCursor.style.left = e.clientX + 'px';
            heartCursor.style.top = e.clientY + 'px';
            createSparkle(e.clientX, e.clientY);
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            // Random offset for extra "sparkle" effect
            const offset = 15;
            sparkle.style.left = (x + (Math.random() - 0.5) * offset) + 'px';
            sparkle.style.top = (y + (Math.random() - 0.5) * offset) + 'px';
            
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1000);
        }

        // Logic สำหรับการเช็คคำตอบ
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                const answer = input.value.toLowerCase().trim();
                
                if (answer === "yes") {
                    music.play();
                    document.getElementById('entrance').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('entrance').style.display = 'none';
                        document.getElementById('stage').style.display = 'block';
                        initSlides();
                        startProgress();
                    }, 2000);
                } else {
                    const trollMessages = [
                        "ไม่รักเค้าจริงหรอ? พิมพ์ใหม่ดิ๊!",
                        "อุ๊ย พิมพ์ผิดหรือเปล่า? ต้อง yes เท่านั้นนะ",
                        "อย่าเล่นตัวเลย พิมพ์ yes เร็วววว",
                        "ทางเลือกมีเยอะแยะ แต่เค้าบังคับให้ตอบ yes ฮ่าๆ",
                        "ถ้าไม่ตอบ yes ก็ไม่ได้ไปต่อนะอ้วน"
                    ];
                    const randomMsg = trollMessages[Math.floor(Math.random() * trollMessages.length)];
                    entranceTitle.innerText = randomMsg;
                    entranceTitle.style.color = "#ff4d4d";
                    input.value = "";
                    input.placeholder = "พิมพ์ 'yes' เดี๋ยวนี้!";
                }
            }
        });

        function initSlides() {
            const container = document.getElementById('slide-container');
            allSlides.forEach((data, i) => {
                const slide = document.createElement('div');
                slide.className = `slide ${i === 0 ? 'active' : ''}`;
                let inner = '';
                if (data.type === 'text') inner = `<div class="content-overlay"><p class="pre-title">${data.pre}</p><h1>${data.h1}</h1><h2>${data.h2}</h2></div>`;
                else if (data.type === 'text_bg') inner = `<img src="${data.bg}" class="visual-bg"><div class="content-overlay"><p class="pre-title">${data.pre}</p><h1>${data.h1}</h1><h2>${data.h2}</h2></div>`;
                else if (data.type === 'photo') inner = `<div class="content-overlay"><div class="photo-frame"><img src="${data.img}" class="photo-img"></div><div class="photo-caption">${data.text}</div></div>`;
                slide.innerHTML = inner;
                container.appendChild(slide);
            });
        }

        function startProgress() {
            const bar = document.getElementById('progress-bar');
            let width = 0;
            clearInterval(progressInterval);
            bar.style.width = '0%';
            const step = 100 / (SLIDE_DURATION / 50);
            progressInterval = setInterval(() => {
                width += step;
                bar.style.width = width + '%';
                if (width >= 100) {
                    clearInterval(progressInterval);
                    if (currentSlideIndex < allSlides.length - 1) goToSlide(currentSlideIndex + 1);
                    else startHearts();
                }
            }, 50);
        }

        function goToSlide(index) {
            if (isAnimating) return;
            isAnimating = true;
            document.body.classList.add('transitioning');
            setTimeout(() => {
                const slides = document.querySelectorAll('.slide');
                if(slides[currentSlideIndex]) slides[currentSlideIndex].classList.remove('active');
                currentSlideIndex = index;
                if(slides[currentSlideIndex]) slides[currentSlideIndex].classList.add('active');
                setTimeout(() => {
                    document.body.classList.remove('transitioning');
                    isAnimating = false;
                    startProgress();
                }, 300);
            }, 2000);
        }

        function startHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 5000);
            }, 400);
        }
    </script>
</body>
</html>
